<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risultati</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Ensure correct path -->
</head>
<body id="results" class="themed-background-results">
    <div id="best-slot">
        <h1 id="results-title">Slot migliore</h1>
        <div class="slot-panels">
            <div id="slot-length-control" class="slot-length-control slot-panel">
                <label for="min-slot-days">Numero minimo di giorni dello slot:</label>
                <div class="slot-length-row">
                    <input id="min-slot-days" type="number" min="1" max="62" value="6" />
                    <button id="apply-slot-days" type="button">Aggiorna</button>
                </div>
                <p class="slot-length-hint">Lo slot viene calcolato con almeno questo numero di giorni e viene esteso se possibile.</p>
            </div>
            <p id="slot-info" class="slot-panel">No data available yet.</p>
        </div>
    </div>
    <div id="calendar"> 
        <div class="calendar-header-result">Lunedì</div>
        <div class="calendar-header-result">Martedì</div>
        <div class="calendar-header-result">Mercoledì</div>
        <div class="calendar-header-result">Giovedì</div>
        <div class="calendar-header-result">Venerdì</div>
        <div class="calendar-header-result">Sabato</div>
        <div class="calendar-header-result">Domenica</div>
    </div>

    <div id="day-popup-overlay" class="day-popup-overlay hidden" aria-hidden="true">
        <div id="day-popup" class="day-popup" role="dialog" aria-modal="true" aria-labelledby="day-popup-title">
            <div id="day-popup-title" class="day-popup-title">Dettagli giorno</div>
            <div id="day-popup-date" class="day-popup-date"></div>
            <div id="day-popup-count" class="day-popup-count"></div>
            <button id="day-popup-close" type="button" class="day-popup-close">Chiudi</button>
        </div>
    </div>
    
    <!-- Aggiungi un div per spaziare dal footer fisso -->
    <div style="height: 100px;"></div>
    
    <!-- Contenitore fisso per il pulsante in fondo alla pagina -->
    <div class="bottom-fixed-container">
        <button onclick="window.location.href='/home'" class="back-button" id="results-button">Torna alla Home</button>
        <div id="end-results">Made by Gioele Rora</div>
    </div>
    
    <script src="/js/results.js"></script>
</body>
</html>
