<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route 2025 - Selezione Clan</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body id="clan-select">
    <div class="container">
        <h1>Route 2025</h1>
        <form id="clan-form">
            <div class="form-group">
                <label for="clan-name">Nome del Clan:</label>
                <input type="text" id="clan-name" name="clan-name" required>
            </div>
            <button type="submit" class="submit-button">Accedi</button>
        </form>
        <div id="error-message" class="hidden error"></div>
    </div>

    <div class="bottom-fixed-container">
        <div id="end-results">Made by Gioele Rora</div>
    </div>

    <script src="/js/clan-select.js"></script>
</body>
</html>
