<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Planner - Selezione Clan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="app-navbar">
        <a href="/" class="brand-link">
            <span class="brand-icon">🏕️</span>
            <span class="brand-text">Route Planner</span>
        </a>
    </header>

    <main class="app-container app-container-narrow">
        <div class="page-header">
            <h1 class="page-title">In Route sì! Ma quando?</h1>
            <p class="page-subtitle">Scegli il tuo gruppo scout o creane uno nuovo per raccogliere le disponibilità estive.</p>
        </div>

        <div class="glass-card">
            <div class="form-group">
                <label for="existing-clans" class="input-label">Seleziona un Clan esistente</label>
                <select id="existing-clans" class="form-control">
                    <option value="">-- Caricamento clan in corso... --</option>
                </select>
            </div>

            <div class="fancy-divider">
                <span>oppure</span>
            </div>

            <form id="clan-form">
                <div class="form-group">
                    <label for="clan-name" class="input-label">Crea un nuovo Clan</label>
                    <input type="text" id="clan-name" name="clan-name" class="form-control" 
                           placeholder="Es. Clan Pegaso, Fuoco La Sorgente..." autocomplete="off">
                    <p class="form-hint">Inserisci il nome del tuo clan o gruppo per iniziare subito a raccogliere le date.</p>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg">
                    <span>Entra nel Gruppo</span>
                    <span>→</span>
                </button>
            </form>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <footer class="app-footer">
        <div>Route Planner &bull; Made with &hearts; for Scouts by Gioele Rora</div>
    </footer>

    <script src="/js/clan-select.js"></script>
</body>
</html>
